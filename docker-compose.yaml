services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redbutton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-redbutton}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DATABASE_DSN: host=postgres user=${POSTGRES_USER:-redbutton} password=${POSTGRES_PASSWORD:-change_me} dbname=${POSTGRES_DB:-redbutton} port=5432 sslmode=disable
      TASKS_DIRECTORY: /app/tasks
    volumes:
      - ./tasks:/app/tasks:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
